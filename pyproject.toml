[project]
name = "persistence"
version = "0.1.0"
description = "Local, provider-agnostic memory server for AI chats (MCP)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.0.0",
    "sqlite-vec>=0.1.6",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
persistence = "persistence.cli:main"
persistence-server = "persistence.server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/persistence"]
